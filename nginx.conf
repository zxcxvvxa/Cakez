worker_processes auto;
events {
    worker_connections 8192;
    multi_accept on;
    use epoll;
}

http {
    client_header_buffer_size 8k;
    large_client_header_buffers 4 32k;
    tcp_nodelay on;
    tcp_nopush off;
    sendfile off;
    keepalive_timeout 3600;

    # Map WebSocket Key fallback if missing
    map $http_sec_websocket_key $ws_key {
        default $http_sec_websocket_key;
        ""      "S2w0eVY4bTBRN3pQNjFqWA==";
    }

    map $http_sec_websocket_version $ws_version {
        default $http_sec_websocket_version;
        ""      "13";
    }

    # Connection upgrade mapping
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Dynamic backend selection based on HTTP/2 gRPC vs HTTP/1.1 WS/XHTTP
    map $http_content_type $is_grpc {
        ~*application/grpc 1;
        default            0;
    }

    server {
        # Standard cleartext listen for GCP Cloud Run edge proxy
        listen 8080;
        server_name _;

        root /var/www/html;
        index index.html;

        # ==========================================
        # 1. SUBSCRIPTION ENDPOINT (HTTP/1.1)
        # ==========================================
        location /sub {
            proxy_pass http://127.0.0.1:8000/sub;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ==========================================
        # 2. SSH / CUSTOM WEBSOCKET (HTTP/1.1)
        # ==========================================
        location /kekz {
            proxy_pass http://127.0.0.1:2222;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Sec-WebSocket-Key $ws_key;
            proxy_set_header Sec-WebSocket-Version $ws_version;
            proxy_set_header Host firebaseremoteconfigrealtime.googleapis.com;
            
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_socket_keepalive on;
        }

        # ==========================================
        # 3. VLESS WEBSOCKET (HTTP/1.1)
        # ==========================================
        location /KekzVLWS {
            proxy_redirect off;
            proxy_pass http://127.0.0.1:10085;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host firebaseremoteconfigrealtime.googleapis.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
        }

        # ==========================================
        # 4. TROJAN WEBSOCKET (HTTP/1.1)
        # ==========================================
        location /KekzTRWS {
            proxy_redirect off;
            proxy_pass http://127.0.0.1:10086;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host firebaseremoteconfigrealtime.googleapis.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
        }

        # ==========================================
        # 5. TROJAN XHTTP (HTTP/1.1 Streaming)
        # ==========================================
        location /KekzTRXH {
            proxy_redirect off;
            proxy_pass http://127.0.0.1:10087;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";

            # Disable all proxy buffering for low-latency XHTTP packet streaming
            proxy_buffering off;
            proxy_request_buffering off;
            chunked_transfer_encoding on;

            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # ==========================================
        # 6. VLESS XHTTP (HTTP/1.1 Streaming)
        # ==========================================
        location /KekzVLXH {
            proxy_redirect off;
            proxy_pass http://127.0.0.1:10088;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";

            # Disable all proxy buffering for low-latency XHTTP packet streaming
            proxy_buffering off;
            proxy_request_buffering off;
            chunked_transfer_encoding on;

            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # ==========================================
        # 7. TROJAN gRPC (h2c / HTTP/2)
        # ==========================================
        location ^~ /kekz-trojan-grpc/ {
            client_max_body_size 0;
            client_body_buffer_size 512k;
            grpc_read_timeout 86400s;
            grpc_send_timeout 86400s;
            grpc_socket_keepalive on;
            grpc_buffer_size 32k;

            grpc_set_header Host $host;
            grpc_set_header X-Real-IP $remote_addr;
            grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            grpc_pass grpc://127.0.0.1:10089;
        }

        # ==========================================
        # 8. VLESS gRPC (h2c / HTTP/2)
        # ==========================================
        location ^~ /kekz-vless-grpc/ {
            client_max_body_size 0;
            client_body_buffer_size 512k;
            grpc_read_timeout 86400s;
            grpc_send_timeout 86400s;
            grpc_socket_keepalive on;
            grpc_buffer_size 32k;

            grpc_set_header Host $host;
            grpc_set_header X-Real-IP $remote_addr;
            grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            grpc_pass grpc://127.0.0.1:10090;
        }

        # Default fallback to static index.html
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
