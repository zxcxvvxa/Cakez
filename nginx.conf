worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 16384;
    multi_accept on;
    use epoll;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Ultra Low Latency TCP & I/O
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on; # Flushes packets instantly without waiting to fill buffer
    keepalive_timeout 30s;
    keepalive_requests 100000;
    reset_timedout_connection on;

    # Low-Latency Proxy Buffer Allocations
    client_body_buffer_size 128k;
    client_max_body_size 0;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;

    # Dynamic Connection Upgrade Mapping
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    # Low-Latency Upstream Keepalives
    upstream backend_sub       { server 127.0.0.1:8000;  keepalive 64; }
    upstream backend_ssh       { server 127.0.0.1:2222;  keepalive 256; } # Increased keepalive pool
    upstream backend_vless_ws  { server 127.0.0.1:10085; keepalive 256; }
    upstream backend_trojan_ws { server 127.0.0.1:10086; keepalive 256; }
    upstream backend_trojan_xh { server 127.0.0.1:10087; keepalive 256; }
    upstream backend_vless_xh  { server 127.0.0.1:10088; keepalive 256; }

    server {
        listen 8080 reuseport;
        server_name _;

        root /var/www/html;
        index index.html;

        # Global Streaming Defaults
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_socket_keepalive on;

        # SSH / Custom WebSocket Low-MS Tuning
        location /kekz {
            proxy_pass http://backend_ssh;

            # Direct Pass WebSocket Headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Force Low-Latency Direct Streaming
            proxy_tcp_nodelay on;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;

            # Completely Bypass Proxy Buffers
            proxy_buffers 8 32k;
            proxy_buffer_size 64k;
            proxy_busy_buffers_size 64k;
        }

        # VLESS WebSocket
        location /KekzVLWS {
            proxy_pass http://backend_vless_ws;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host firebaseremoteconfigrealtime.googleapis.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_tcp_nodelay on;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Trojan WebSocket
        location /KekzTRWS {
            proxy_pass http://backend_trojan_ws;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host firebaseremoteconfigrealtime.googleapis.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_tcp_nodelay on;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Trojan XHTTP
        location /KekzTRXH {
            proxy_pass http://backend_trojan_xh;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            chunked_transfer_encoding on;
            proxy_tcp_nodelay on;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # VLESS XHTTP
        location /KekzVLXH {
            proxy_pass http://backend_vless_xh;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            chunked_transfer_encoding on;
            proxy_tcp_nodelay on;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Subscription Endpoint
        location /sub {
            proxy_pass http://backend_sub;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Static Web Root Fallback
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
