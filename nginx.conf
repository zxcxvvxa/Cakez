worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 16384;
    multi_accept on;
    use epoll;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # High-Performance I/O & Networking
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65s;
    keepalive_requests 100000;
    reset_timedout_connection on;

    # Buffer Adjustments (Prevents latency spikes under payload bursts)
    client_body_buffer_size 128k;
    client_max_body_size 0; # Unlimited payload streaming
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;

    # WebSocket Mapping Rules
    map $http_sec_websocket_key $ws_key {
        default $http_sec_websocket_key;
        ""      "S2w0eVY4bTBRN3pQNjFqWA==";
    }

    map $http_sec_websocket_version $ws_version {
        default $http_sec_websocket_version;
        ""      "13";
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Upstream Keepalive Pools (Reduces localhost TCP handshake overhead)
    upstream backend_sub {
        server 127.0.0.1:8000;
        keepalive 64;
    }

    upstream backend_ssh {
        server 127.0.0.1:2222;
        keepalive 128;
    }

    upstream backend_vless_ws {
        server 127.0.0.1:10085;
        keepalive 256;
    }

    upstream backend_trojan_ws {
        server 127.0.0.1:10086;
        keepalive 256;
    }

    upstream backend_trojan_xh {
        server 127.0.0.1:10087;
        keepalive 256;
    }

    upstream backend_vless_xh {
        server 127.0.0.1:10088;
        keepalive 256;
    }

    server {
        listen 8080 reuseport;
        server_name _;

        root /var/www/html;
        index index.html;

        # Subscription Endpoint
        location /sub {
            proxy_pass http://backend_sub;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # SSH / Custom WebSocket
        location /kekz {
            proxy_pass http://backend_ssh;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Sec-WebSocket-Key $ws_key;
            proxy_set_header Sec-WebSocket-Version $ws_version;
            proxy_set_header Host firebaseremoteconfigrealtime.googleapis.com;
            
            # Real-time zero-buffering tuning
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_socket_keepalive on;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # VLESS WebSocket
        location /KekzVLWS {
            proxy_redirect off;
            proxy_pass http://backend_vless_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host firebaseremoteconfigrealtime.googleapis.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Real-time streaming
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_socket_keepalive on;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Trojan WebSocket
        location /KekzTRWS {
            proxy_redirect off;
            proxy_pass http://backend_trojan_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host firebaseremoteconfigrealtime.googleapis.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Real-time streaming
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_socket_keepalive on;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Trojan XHTTP
        location /KekzTRXH {
            proxy_redirect off;
            proxy_pass http://backend_trojan_xh;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Low latency XHTTP streaming support
            proxy_buffering off;
            proxy_request_buffering off;
            chunked_transfer_encoding on;
            proxy_socket_keepalive on;

            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # VLESS XHTTP
        location /KekzVLXH {
            proxy_redirect off;
            proxy_pass http://backend_vless_xh;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Low latency XHTTP streaming support
            proxy_buffering off;
            proxy_request_buffering off;
            chunked_transfer_encoding on;
            proxy_socket_keepalive on;

            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Static Web Root Fallback
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
